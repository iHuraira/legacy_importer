[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-importer"
version = "0.1.0"
description = "Idempotent importer for historical DNA sequencing outputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "psycopg2-binary>=2.9",
  "google-cloud-storage>=2.16",
  "protobuf>=5.29.6,<6",
  "python-dotenv>=1.0",
  "bio-extractors==0.1.11",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
legacy-import = "legacy_importer.cli:app"

[tool.setuptools.packages.find]
include = ["legacy_importer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
